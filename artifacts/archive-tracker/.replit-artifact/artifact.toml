kind = "web"
previewPath = "/"
title = "Arciflow"
version = "1.0.0"
id = "artifacts/archive-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21967

[services.development]
run = "pnpm --filter @workspace/archive-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/archive-tracker", "run", "build" ]
publicDir = "artifacts/archive-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21967"
BASE_PATH = "/"
